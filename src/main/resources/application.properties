spring.application.name=hairia
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/hairia}
spring.datasource.username=${DATABASE_USERNAME:hairia}
spring.datasource.password=${DATABASE_PASSWORD:hairia_dev}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# 既定ではデモデータ付きで起動します。本番は SPRING_PROFILES_ACTIVE=prod を指定してください。
spring.profiles.default=demo
